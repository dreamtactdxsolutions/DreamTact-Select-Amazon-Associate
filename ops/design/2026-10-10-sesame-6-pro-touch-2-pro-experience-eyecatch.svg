<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">鍵から解放された話 セサミ6プロ＋セサミタッチ2プロを約2か月</title>
  <desc id="desc">DreamTact Select の記事アイキャッチ。濃紺の背景に、左に斜線で消した鍵の抽象アイコン、右にスマートフォンと指紋の抽象アイコンを置き、間に矢印。下に「鍵から解放された話」と「セサミ6プロ＋セサミタッチ2プロを約2か月」。右上に「運営者の体験記」、左上に白地のPRラベル。商品写真やロゴは使っていない。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3cf55"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="none" stroke="#d4af37" stroke-opacity="0.07" stroke-width="2">
    <circle cx="600" cy="255" r="190"/>
    <circle cx="600" cy="255" r="250"/>
    <circle cx="600" cy="255" r="310"/>
  </g>
  <rect x="0" y="0" width="1200" height="6" fill="url(#gold)"/>
  <rect x="0" y="624" width="1200" height="6" fill="url(#gold)"/>

  <!-- PR -->
  <g>
    <rect x="84" y="76" width="112" height="58" rx="10" fill="#f3f4f6"/>
    <text x="140" y="119" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="900" fill="#0a0f1d" letter-spacing="2">PR</text>
  </g>
  <text x="1116" y="116" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="32" font-weight="500" fill="#9ca3af">運営者の体験記</text>

  <!-- 左：斜線で消した鍵 -->
  <g>
    <rect x="130" y="152" width="320" height="230" rx="20" fill="#111827" stroke="#374151" stroke-width="2"/>
    <g fill="none" stroke="#9ca3af" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="238" cy="236" r="34"/>
      <line x1="270" y1="258" x2="372" y2="322"/>
      <line x1="338" y1="301" x2="326" y2="324"/>
      <line x1="358" y1="313" x2="346" y2="336"/>
    </g>
    <circle cx="238" cy="236" r="9" fill="#9ca3af"/>
    <line x1="170" y1="192" x2="410" y2="344" stroke="#d4af37" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- 矢印 -->
  <g fill="none" stroke="#d4af37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <line x1="520" y1="267" x2="672" y2="267"/>
    <polyline points="636,231 676,267 636,303"/>
  </g>

  <!-- 右：スマートフォンと指紋 -->
  <g>
    <rect x="750" y="152" width="320" height="230" rx="20" fill="#111827" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="750" y="152" width="320" height="8" rx="4" fill="url(#blue)"/>
    <rect x="822" y="178" width="108" height="180" rx="16" fill="none" stroke="#3b82f6" stroke-width="5"/>
    <line x1="862" y1="192" x2="890" y2="192" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <!-- 指紋 -->
    <g fill="none" stroke="#60a5fa" stroke-width="4.5" stroke-linecap="round">
      <path d="M 854 286 A 22 22 0 0 1 898 286"/>
      <path d="M 842 296 A 34 34 0 0 1 910 296"/>
      <path d="M 866 306 L 866 288 A 10 10 0 0 1 886 288 L 886 312"/>
      <path d="M 856 312 L 856 292"/>
      <path d="M 896 304 L 896 322"/>
    </g>
    <!-- 小さな円（アプリのドットを表す抽象図形） -->
    <g fill="#d4af37"><circle cx="982" cy="232" r="9"/><circle cx="1012" cy="232" r="9" fill-opacity="0.6"/><circle cx="1042" cy="232" r="9" fill-opacity="0.3"/></g>
  </g>

  <!-- メインコピー -->
  <g font-family="'Noto Sans JP', sans-serif" font-size="76" font-weight="900">
    <text x="246" y="466" fill="#f3f4f6">鍵から</text>
    <text x="476" y="466" fill="#d4af37">解放された</text>
    <text x="870" y="466" fill="#f3f4f6">話</text>
  </g>
  <!-- サブコピー -->
  <text x="600" y="526" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="500" fill="#9ca3af">セサミ6プロ＋セサミタッチ2プロを約2か月</text>
  <text x="1116" y="592" text-anchor="end" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="28" font-weight="600" fill="#d4af37" letter-spacing="1">DreamTact Select</text>
</svg>
