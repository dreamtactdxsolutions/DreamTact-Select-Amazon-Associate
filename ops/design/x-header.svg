<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="t">
  <title id="t">DreamTact Select ヘッダー：家電・ガジェットを、スペックと価格で比べる。</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#374151" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)" opacity="0.5"/>

  <!-- 右端の抽象装飾：比較を表す2本のバー（A=ゴールド、B=青。上下の意味は持たせない） -->
  <g opacity="0.5">
    <rect x="1432" y="150" width="14" height="200" rx="7" fill="#d4af37"/>
    <rect x="1458" y="150" width="14" height="200" rx="7" fill="#3b82f6"/>
  </g>
  <!-- 背景の薄い勲章リング（装飾） -->
  <circle cx="900" cy="250" r="230" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.12"/>
  <circle cx="900" cy="250" r="190" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.08"/>

  <!-- 文字は中央やや右（x=900基準）・上下中央付近（y=170〜340）に配置 -->
  <text x="900" y="150" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="30" font-weight="700" letter-spacing="6" fill="#d4af37">家電・ガジェット比較</text>
  <text x="900" y="250" text-anchor="middle" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="104" font-weight="800" letter-spacing="1" fill="url(#goldText)">DreamTact Select</text>
  <rect x="660" y="282" width="480" height="3" fill="url(#rule)"/>
  <text x="900" y="345" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="700" fill="#f3f4f6">家電・ガジェットを、スペックと価格で比べる。</text>
</svg>
