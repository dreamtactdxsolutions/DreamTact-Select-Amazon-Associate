<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">プライム感謝祭2026 セール前の価格メモ 10品</title>
  <desc id="desc">DreamTact Select の記事アイキャッチ。濃紺の背景にノートの罫線のような薄い線。中央に大きく「プライム感謝祭2026」、その下に「セール前の価格メモ 10品」と「家電・ガジェット・美容・日用品・本」。左上に白地のPRラベル、右上に「10/16〜10/19」。商品写真・ロゴ・価格・割引率は使っていない。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3cf55"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 装飾：メモ帳の罫線と左の余白線（抽象図形。商品は描かない） -->
  <g stroke="#9ca3af" stroke-opacity="0.07" stroke-width="2">
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="0" y1="410" x2="1200" y2="410"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
  </g>
  <line x1="48" y1="6" x2="48" y2="624" stroke="#d4af37" stroke-opacity="0.18" stroke-width="2"/>
  <!-- 上下のゴールドライン -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#gold)"/>
  <rect x="0" y="624" width="1200" height="6" fill="url(#gold)"/>

  <!-- PR表記（左上・主要文字の範囲 1040×480 の内側。白地に濃紺の太字40px） -->
  <g>
    <rect x="84" y="76" width="112" height="58" rx="10" fill="#f3f4f6"/>
    <text x="140" y="119" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="900" fill="#0a0f1d" letter-spacing="2">PR</text>
  </g>

  <!-- 開催日（右上） -->
  <g>
    <rect x="874" y="76" width="242" height="58" rx="29" fill="none" stroke="#d4af37" stroke-opacity="0.7" stroke-width="2"/>
    <text x="995" y="116" text-anchor="middle" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="32" font-weight="700" fill="#d4af37">10/16〜10/19</text>
  </g>

  <!-- メインコピー -->
  <text x="600" y="280" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="84" font-weight="900" fill="#f3f4f6">プライム感謝祭<tspan font-family="'Outfit', 'Noto Sans JP', sans-serif" font-weight="800" fill="url(#gold)">2026</tspan></text>

  <!-- 区切り -->
  <rect x="520" y="314" width="160" height="5" rx="2.5" fill="url(#gold)"/>

  <!-- サブコピー1 -->
  <text x="600" y="414" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="60" font-weight="800" fill="#f3f4f6">セール前の価格メモ <tspan fill="url(#gold)" font-size="76" font-weight="900">10</tspan><tspan fill="url(#gold)">品</tspan></text>

  <!-- サブコピー2：ジャンル -->
  <text x="600" y="496" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="500" fill="#9ca3af">家電<tspan fill="#d4af37">・</tspan>ガジェット<tspan fill="#d4af37">・</tspan>美容<tspan fill="#d4af37">・</tspan>日用品<tspan fill="#d4af37">・</tspan>本</text>

  <!-- サイト名 -->
  <text x="1116" y="592" text-anchor="end" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="28" font-weight="600" fill="#d4af37" letter-spacing="1">DreamTact Select</text>
</svg>
