<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ノンフライヤー3機種を比べる Ninja Crispi（使用）と COSORI 4.7L・6L（スペック比較）</title>
  <desc id="desc">DreamTact Select の記事アイキャッチ。濃紺の背景に、角丸の四角で描いた調理家電の抽象アイコンを3つ並べ、Ninja（使用）、COSORI 4.7L、COSORI 6L（商品ページの記載）とラベルを付けた。下にメインコピーとサブコピー。右上に「Ninjaは運営者が自費購入」、左上に白地のPRラベル。商品写真やロゴは使っていない。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1d"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3cf55"/><stop offset="0.5" stop-color="#d4af37"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="none" stroke="#d4af37" stroke-opacity="0.07" stroke-width="2"><circle cx="600" cy="255" r="190"/><circle cx="600" cy="255" r="250"/><circle cx="600" cy="255" r="310"/></g>
  <rect x="0" y="0" width="1200" height="6" fill="url(#gold)"/>
  <rect x="0" y="624" width="1200" height="6" fill="url(#gold)"/>
  <g>
    <rect x="84" y="76" width="112" height="58" rx="10" fill="#f3f4f6"/>
    <text x="140" y="119" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="900" fill="#0a0f1d" letter-spacing="2">PR</text>
  </g>
  <text x="1116" y="116" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="32" font-weight="500" fill="#9ca3af">Ninjaは運営者が自費購入</text>
  <!-- Ninja -->
  <g>
    <rect x="140" y="156" width="280" height="226" rx="20" fill="#111827" stroke="#d4af37" stroke-opacity="1" stroke-width="3"/>
    <rect x="140" y="156" width="280" height="8" rx="4" fill="url(#gold)"/>
    <rect x="160" y="180" width="108" height="42" rx="21" fill="#d4af37" stroke="#d4af37" stroke-width="2"/>
    <text x="214.0" y="210" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#0a0f1d">使用</text>
    <rect x="230" y="236" width="100" height="80" rx="22" fill="none" stroke="#f3cf55" stroke-width="6"/>
    <rect x="252" y="258" width="56" height="36" rx="10" fill="none" stroke="#f3cf55" stroke-width="4" stroke-opacity="0.7"/>
    <line x1="340" y1="276" x2="362" y2="276" stroke="#f3cf55" stroke-width="6" stroke-linecap="round"/>
    <text x="280" y="362" text-anchor="middle" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#f3f4f6">Ninja</text>
  </g>
  <!-- COSORI 4.7L -->
  <g>
    <rect x="460" y="156" width="280" height="226" rx="20" fill="#111827" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="460" y="156" width="280" height="8" rx="4" fill="url(#blue)"/>
    <rect x="480" y="180" width="240" height="42" rx="21" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="600.0" y="210" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#60a5fa">商品ページの記載</text>
    <rect x="550" y="236" width="100" height="80" rx="22" fill="none" stroke="#60a5fa" stroke-width="6"/>
    <rect x="572" y="258" width="56" height="36" rx="10" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.7"/>
    <line x1="660" y1="276" x2="682" y2="276" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
    <text x="600" y="362" text-anchor="middle" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#f3f4f6">COSORI 4.7L</text>
  </g>
  <!-- COSORI 6L -->
  <g>
    <rect x="780" y="156" width="280" height="226" rx="20" fill="#111827" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="780" y="156" width="280" height="8" rx="4" fill="url(#blue)"/>
    <rect x="800" y="180" width="240" height="42" rx="21" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="920.0" y="210" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="700" fill="#60a5fa">商品ページの記載</text>
    <rect x="870" y="236" width="100" height="80" rx="22" fill="none" stroke="#60a5fa" stroke-width="6"/>
    <rect x="892" y="258" width="56" height="36" rx="10" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.7"/>
    <line x1="980" y1="276" x2="1002" y2="276" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
    <text x="920" y="362" text-anchor="middle" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#f3f4f6">COSORI 6L</text>
  </g>
  <text x="600" y="456" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="72" font-weight="900" fill="#f3f4f6">ノンフライヤー<tspan fill="#d4af37">3機種</tspan>を比べる</text>
  <text x="600" y="516" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="500" fill="#9ca3af">Ninja Crispi（使用）と COSORI 4.7L・6L（スペック比較）</text>
  <text x="1116" y="592" text-anchor="end" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="28" font-weight="600" fill="#d4af37" letter-spacing="1">DreamTact Select</text>
</svg>
