<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">マグニフィカS vs マグニフィカ スタート 違いを比較</title>
  <desc id="desc">DreamTact Select の記事アイキャッチ。濃紺の背景に、左にマグニフィカS（ゴールド）、右にマグニフィカ スタート（青）の名前を置き、中央にVSのマーク。下に「違いを比較」と「スペック比較でわかる、どっちを選ぶか」。左上に白地のPRラベル。商品写真やロゴは使っていない。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3cf55"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 装飾：コーヒーの湯気を思わせる薄い同心円（商品を描かない抽象図形） -->
  <g fill="none" stroke="#d4af37" stroke-opacity="0.07" stroke-width="2">
    <circle cx="600" cy="265" r="190"/>
    <circle cx="600" cy="265" r="250"/>
    <circle cx="600" cy="265" r="310"/>
  </g>
  <!-- 上下のゴールドライン -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#gold)"/>
  <rect x="0" y="624" width="1200" height="6" fill="url(#gold)"/>

  <!-- PR表記（左上・主要文字の範囲 1040×480 の内側。白地に濃紺の太字40px） -->
  <g>
    <rect x="84" y="76" width="112" height="58" rx="10" fill="#f3f4f6"/>
    <text x="140" y="119" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="900" fill="#0a0f1d" letter-spacing="2">PR</text>
  </g>

  <!-- 記事タイプ（右上） -->
  <text x="1116" y="116" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="500" fill="#9ca3af">デロンギ 全自動コーヒーマシン</text>

  <!-- 左カード：マグニフィカS（ゴールド） -->
  <g>
    <rect x="80" y="152" width="420" height="230" rx="20" fill="#111827" stroke="#d4af37" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="80" y="152" width="420" height="8" rx="4" fill="url(#gold)"/>
    <text x="290" y="206" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="32" font-weight="500" fill="#9ca3af">デロンギ</text>
    <text x="290" y="304" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="54" font-weight="900" fill="url(#gold)">マグニフィカS</text>
  </g>

  <!-- 右カード：マグニフィカ スタート（青） -->
  <g>
    <rect x="700" y="152" width="420" height="230" rx="20" fill="#111827" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="700" y="152" width="420" height="8" rx="4" fill="url(#blue)"/>
    <text x="910" y="206" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="32" font-weight="500" fill="#9ca3af">デロンギ</text>
    <text x="910" y="282" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="56" font-weight="900" fill="url(#blue)">マグニフィカ</text>
    <text x="910" y="350" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="56" font-weight="900" fill="url(#blue)">スタート</text>
  </g>

  <!-- VS -->
  <g>
    <circle cx="600" cy="267" r="62" fill="#0a0f1d" stroke="url(#gold)" stroke-width="4"/>
    <text x="600" y="288" text-anchor="middle" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="56" font-weight="800" fill="#f3f4f6">VS</text>
  </g>

  <!-- メインコピー -->
  <text x="600" y="472" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="80" font-weight="900" fill="#f3f4f6">違いを<tspan fill="url(#gold)">比較</tspan></text>

  <!-- サブコピー -->
  <text x="600" y="532" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="500" fill="#9ca3af">スペック比較でわかる、どっちを選ぶか</text>

  <!-- サイト名 -->
  <text x="1116" y="592" text-anchor="end" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="28" font-weight="600" fill="#d4af37" letter-spacing="1">DreamTact Select</text>
</svg>
