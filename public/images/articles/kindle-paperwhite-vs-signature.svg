<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kindle Paperwhite vs シグニチャー 5,000円の差を、スペックで比べる</title>
  <desc id="desc">DreamTact Select の記事アイキャッチ。濃紺の背景に、左にPaperwhite（ゴールド）、右にシグニチャー（青）の名前と、電子書籍リーダーを思わせる抽象的な枠線を置き、中央にVSのマーク。下に「Kindle Paperwhite vs シグニチャー」と「5,000円の差を、スペックで比べる」、2026年10月8日時点の日付。左上に白地のPRラベル。商品写真やロゴは使っていない。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3cf55"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="none" stroke="#d4af37" stroke-opacity="0.07" stroke-width="2">
    <circle cx="600" cy="255" r="190"/>
    <circle cx="600" cy="255" r="250"/>
    <circle cx="600" cy="255" r="310"/>
  </g>
  <rect x="0" y="0" width="1200" height="6" fill="url(#gold)"/>
  <rect x="0" y="624" width="1200" height="6" fill="url(#gold)"/>

  <!-- PR -->
  <g>
    <rect x="84" y="76" width="112" height="58" rx="10" fill="#f3f4f6"/>
    <text x="140" y="119" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="900" fill="#0a0f1d" letter-spacing="2">PR</text>
  </g>
  <text x="1116" y="116" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="500" fill="#9ca3af">電子書籍リーダー スペック比較</text>

  <!-- 左カード（ゴールド） -->
  <g>
    <rect x="80" y="152" width="420" height="230" rx="20" fill="#111827" stroke="#d4af37" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="80" y="152" width="420" height="8" rx="4" fill="url(#gold)"/>
    <!-- 抽象リーダー枠 -->
    <rect x="110" y="188" width="118" height="158" rx="14" fill="none" stroke="#d4af37" stroke-width="4"/>
    <rect x="124" y="204" width="90" height="116" rx="4" fill="#d4af37" fill-opacity="0.12"/>
    <g stroke="#d4af37" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"><line x1="134" y1="226" x2="204" y2="226"/><line x1="134" y1="246" x2="204" y2="246"/><line x1="134" y1="266" x2="190" y2="266"/></g>
    <text x="364" y="262" text-anchor="middle" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="34" font-weight="800" fill="url(#gold)">Paperwhite</text>
  </g>

  <!-- 右カード（青） -->
  <g>
    <rect x="700" y="152" width="420" height="230" rx="20" fill="#111827" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="700" y="152" width="420" height="8" rx="4" fill="url(#blue)"/>
    <rect x="730" y="188" width="118" height="158" rx="14" fill="none" stroke="#3b82f6" stroke-width="4"/>
    <rect x="744" y="204" width="90" height="116" rx="4" fill="#3b82f6" fill-opacity="0.14"/>
    <g stroke="#60a5fa" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round"><line x1="754" y1="226" x2="824" y2="226"/><line x1="754" y1="246" x2="824" y2="246"/><line x1="754" y1="266" x2="810" y2="266"/></g>
    <text x="984" y="262" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="34" font-weight="900" fill="url(#blue)">シグニチャー</text>
  </g>

  <!-- VS -->
  <g>
    <circle cx="600" cy="267" r="62" fill="#0a0f1d" stroke="url(#gold)" stroke-width="4"/>
    <text x="600" y="288" text-anchor="middle" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="56" font-weight="800" fill="#f3f4f6">VS</text>
  </g>

  <!-- メインコピー -->
  <text x="600" y="466" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="56" font-weight="900" fill="#f3f4f6">Kindle Paperwhite vs シグニチャー</text>
  <!-- サブコピー -->
  <text x="600" y="526" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="500" fill="#9ca3af">5,000円の差を、スペックで比べる</text>
  <!-- 日付 -->
  <text x="84" y="592" text-anchor="start" font-family="'Noto Sans JP', sans-serif" font-size="28" font-weight="400" fill="#9ca3af">2026年10月8日時点</text>
  <text x="1116" y="592" text-anchor="end" font-family="'Outfit', 'Noto Sans JP', sans-serif" font-size="28" font-weight="600" fill="#d4af37" letter-spacing="1">DreamTact Select</text>
</svg>
